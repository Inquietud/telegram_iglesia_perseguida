name: Canal de la Iglesia perseguida

on:
  schedule:
    # cada 30 minutos. GitHub puede retrasarlo unos minutos si hay mucha carga.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # boton para lanzarlo a mano desde la pestana Actions

permissions:
  contents: write           # necesario para guardar estado.json de vuelta

concurrency:
  group: bot-canal
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Una pasada del bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          EMAIL_TRADUCTOR: ${{ secrets.EMAIL_TRADUCTOR }}
          TRADUCIR: "true"
          MAX_ANTIGUEDAD_HORAS: "48"
          HASHTAG_FIJO: "#IglesiaPerseguida"
        run: python bot.py --una-vez

      - name: Guardar el estado
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json traducciones.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "estado $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push || true
